[project]
name = "memoframe"
version = "1.0.0"

[tool.pyrefly]
search-path = [
    "services/engine",
    "."
]

[tool.pytest.ini_options]
testpaths = ["services/engine/tests"]
pythonpath = ["services/engine"]
addopts = -q

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "dist",
    "node_modules",
    "workspace",
    "ws_*",
    "smoke_*",
    "apps/desktop"
]

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B"]
ignore = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
