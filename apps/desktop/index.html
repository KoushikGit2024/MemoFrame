<!DOCTYPE html>
<html lang="en" data-theme="Studio Graphite Dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src 'self' http://localhost:* ws://localhost:*; img-src 'self' memoframe-media: data: blob: http://localhost:*; media-src 'self' memoframe-media: data: blob: http://localhost:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' http://localhost:*;"
  />
  <title>MemoFrame — Local Photo &amp; Face Intelligence</title>
  <script>
    try {
      const t = localStorage.getItem("memoframe_theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch {}
  </script>
</head>
<body class="bg-app text-primary font-sans antialiased overflow-hidden select-none">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
