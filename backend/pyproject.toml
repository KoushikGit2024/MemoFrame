[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memoframe-backend"
version = "1.0.0"
description = "Local photo organizer with face detection, duplicates and event grouping."
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pillow-heif>=0.13.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
]

[project.scripts]
memoframe = "cli:main"

[tool.setuptools]
py-modules = ["cli", "config", "models"]

[tool.setuptools.packages.find]
where = ["."]
include = ["database*", "engine*", "services*", "utils*"]

[tool.setuptools.package-data]
database = ["schema.sql"]

[tool.pyright]
extraPaths = [".", ".."]

[tool.pyrefly]
search-path = [".", ".."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
