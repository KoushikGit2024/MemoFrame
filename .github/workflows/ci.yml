name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint:
    name: Python Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check services/engine packaging/pyinstaller

  python-tests:
    name: Python Tests (${{ matrix.os }} / py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux OpenCV system libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/engine/requirements-dev.txt
      - name: Run engine, migration, RPC & observability tests
        working-directory: services/engine
        run: pytest tests -rs

  desktop-checks:
    name: Desktop Typecheck, Lint & Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Check Electron main-process JS syntax
        working-directory: apps/desktop
        run: |
          for f in electron/*.js; do
            node --check "$f"
          done
      - name: TypeScript typecheck
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Vite production web build
        working-directory: apps/desktop
        run: npm run build:web

  windows-pyinstaller-smoke:
    name: Windows PyInstaller server.exe Smoke Test
    needs: [python-tests, desktop-checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime deps & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r services/engine/requirements.txt pyinstaller
      - name: Build frozen RPC server.exe
        working-directory: apps/desktop
        run: python -m PyInstaller --noconfirm --distpath build-backend --workpath build-backend-work ../../packaging/pyinstaller/server.spec
      - name: Smoke-test frozen server.exe NDJSON-RPC
        shell: pwsh
        run: |
          $tmpWs = Join-Path $env:RUNNER_TEMP "mf_smoke_ws"
          New-Item -ItemType Directory -Force -Path $tmpWs | Out-Null
          $env:MEMOFRAME_WORKSPACE = $tmpWs
          $exe = "apps\desktop\build-backend\server\server.exe"
          if (-not (Test-Path $exe)) { throw "server.exe not found!" }
          $reqs = @(
            '{"id":1,"method":"system.init","params":{}}',
            '{"id":2,"method":"analytics.overview","params":{"range":"all"}}',
            '{"id":3,"method":"models.status","params":{}}'
          ) -join "`n"
          $out = $reqs | & $exe
          Write-Host $out
          if ($out -notmatch '"bridge\.ready"') { throw "Missing bridge.ready event" }
          if ($out -notmatch '"id":\s*1.*"ok":\s*true') { throw "system.init failed" }
          if ($out -notmatch '"id":\s*2.*"ok":\s*true') { throw "analytics.overview failed" }
