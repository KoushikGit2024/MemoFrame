[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memoframe-engine"
version = "1.0.0"
description = "Local photo & face intelligence engine and NDJSON-RPC server for MemoFrame."
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pillow-heif>=0.16.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
]

[project.scripts]
memoframe = "memoframe_engine.cli.cli:main"
memoframe-rpc = "memoframe_engine.rpc.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["memoframe_engine*"]

[tool.setuptools.package-data]
"memoframe_engine.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = -q
